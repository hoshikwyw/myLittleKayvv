<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Kayv — offline</title>
    <!--
      Shown by the Android shell when the deployment cannot be reached.

      Bundled into the APK, so it has to stand entirely on its own: no fonts,
      no scripts from elsewhere, nothing that would itself need the network it
      is here to say is missing.

      The colours mirror the tokens in src/app/globals.css. This page cannot
      import that file, so they are declared once as variables here instead of
      being scattered through the rules below.
    -->
    <style>
      :root {
        --bg: #04070d;
        --surface: #0a1420;
        --border: #16344a;
        --text: #dff1fb;
        --text-muted: #7fa8c4;
        --accent: #22d3ee;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        height: 100%;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      body {
        display: grid;
        place-items: center;
        /* Clear of the notch and the gesture bar on an edge-to-edge screen. */
        padding: max(24px, env(safe-area-inset-top)) 24px
          max(24px, env(safe-area-inset-bottom));
      }

      main {
        width: 100%;
        max-width: 22rem;
        text-align: center;
      }

      .ring {
        width: 5rem;
        height: 5rem;
        margin: 0 auto 1.75rem;
        border: 1px solid var(--border);
        border-radius: 50%;
        display: grid;
        place-items: center;
      }

      .core {
        width: 2rem;
        height: 2rem;
        border-radius: 50%;
        border: 1px solid var(--text-muted);
        opacity: 0.5;
      }

      .label {
        font: 600 0.7rem ui-monospace, "Cascadia Mono", monospace;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--text-muted);
        margin: 0 0 0.75rem;
      }

      h1 {
        font-size: 1.15rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }

      p {
        color: var(--text-muted);
        font-size: 0.9rem;
        line-height: 1.5;
        margin: 0 0 1.75rem;
      }

      button {
        width: 100%;
        padding: 0.85rem;
        border-radius: 4px;
        border: 1px solid var(--accent);
        background: var(--surface);
        color: var(--accent);
        font: 600 0.75rem ui-monospace, "Cascadia Mono", monospace;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }

      button:active {
        transform: scale(0.99);
      }

      button[disabled] {
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="ring" aria-hidden="true"><div class="core"></div></div>
      <p class="label">offline</p>
      <h1>Kayv can't reach the internet</h1>
      <p>
        Everything it knows lives on the server, so there is nothing to show
        until the connection is back. Your reminders still arrive on Telegram.
      </p>
      <button id="retry" type="button">try again</button>
    </main>

    <script>
      /*
       * "Try again" goes back to the app, not to this page.
       *
       * This page is a local file, so reloading it would only reload the error.
       * The app's real address comes from the same app-url.json the Capacitor
       * config reads, so the two cannot drift apart.
       */
      const button = document.getElementById("retry");

      button.addEventListener("click", async () => {
        button.disabled = true;
        button.textContent = "connecting…";

        try {
          const response = await fetch("app-url.json", { cache: "no-store" });
          const { url } = await response.json();
          window.location.replace(url);
        } catch {
          button.disabled = false;
          button.textContent = "try again";
        }
      });
    </script>
  </body>
</html>
